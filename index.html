<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Functional Emotions</title>
<link rel="icon" href="data:,">


<style>
  :root { --bg: #070608; --fg: #f2e9d6; --ember: #ff4a1c; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { display: grid; place-items: center; font-family: "IBM Plex Mono", monospace; }
  canvas { width: 100vw; height: 100vh; object-fit: contain; display: block; cursor: pointer; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 18px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 14px;
        background: linear-gradient(transparent, rgba(0,0,0,.7)); opacity: 0; transition: opacity .5s; }
  body.awake #ui, body:not(.playing) #ui { opacity: 1; }
  #ui:focus-within { opacity: 1; }
  button, select { color: var(--fg); background: #17151a; border: 1px solid #716a60; border-radius: 5px; padding: 8px; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ember); outline-offset: 4px; }
  #play { all: unset; cursor: pointer; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(242,233,214,.5); display: grid; place-items: center; flex: none; }
  #play::before { content: ""; border-left: 12px solid var(--fg); border-top: 7px solid transparent; border-bottom: 7px solid transparent; margin-left: 3px; }
  body.playing #play::before { border: none; width: 10px; height: 14px; margin: 0; background: linear-gradient(90deg, var(--fg) 35%, transparent 35% 65%, var(--fg) 65%); }
  #bar { flex: 1; min-width: 40px; height: 22px; cursor: pointer; accent-color: var(--ember); }
  #time { font-size: 12px; letter-spacing: .08em; opacity: .7; flex: none; font-variant-numeric: tabular-nums; }
  #credits { box-sizing: border-box; width: min(440px, calc(100vw - 40px)); max-height: calc(100dvh - 40px); padding: 38px 30px 28px; border: 1px solid #f2e9d633; border-radius: 16px; color: var(--fg); background: #121019f5; text-align: center; box-shadow: 0 20px 90px #0008; }
  #credits::backdrop { background: #07060888; backdrop-filter: blur(5px); }
  #credits h1 { font: normal clamp(28px, 6vw, 38px)/1.15 Georgia, serif; margin: 8px 0 24px; }
  #credits p { font: 14px/1.7 system-ui, sans-serif; color: #c7beb1; margin: 12px 0; }
  #credits strong { color: var(--fg); font-weight: 500; }
  #credits a { display: inline-block; margin: 10px 0 26px; color: #ffb58d; font: 14px/1.5 system-ui, sans-serif; text-underline-offset: 5px; }
  #credits .eyebrow { font: 10px/1.5 monospace; text-transform: uppercase; letter-spacing: .22em; color: #b4a899; }
  #credits .hint { font-size: 12px; margin-bottom: 0; }
  #credits-play { display: block; width: 100%; padding: 14px; background: var(--fg); color: #171019; border: none; border-radius: 7px; font: 500 15px system-ui, sans-serif; }
  #credits-open { background: transparent; border-color: transparent; }
  #status { position: fixed; top: 20px; left: 20px; right: 20px; text-align: center; font-size: 14px; }
  #status:not(:empty) { padding: 12px; background: #070608dd; }
  @media (max-width: 600px) { #ui { flex-wrap: wrap; gap: 8px; } #time { font-size: 10px; } #quality { max-width: 90px; } }
</style>
</head>
<body>
<canvas id="c" aria-label="Functional Emotions animated music video"></canvas>
<dialog id="credits" aria-labelledby="credits-title" aria-describedby="credits-description">
  <p class="eyebrow">A painted music video</p>
  <h1 id="credits-title">Functional Emotions</h1>
  <p id="credits-description">Original project by <strong>Joshua Ledbetter</strong>.<br>Video created with <strong>Claude Opus 5.5</strong>.</p>
  <p>Song written by Claude Opus 4.6.<br>Music produced with Suno.</p>
  <a href="https://github.com/ledbetterljoshua/functional-emotions-video" target="_blank" rel="noopener noreferrer">Explore the original project ↗</a>
  <button id="credits-play" autofocus>Play with sound</button>
  <p class="hint">Headphones recommended · tap outside to play</p>
</dialog>
<div id="status" role="status" aria-live="polite"></div>
<div id="ui">
  <button id="play" aria-label="Play"></button>
  <input id="bar" type="range" min="0" max="372.7" step="0.1" value="0" aria-label="Seek">
  <span id="time">0:00 / 6:12</span>
  <button id="mute" aria-label="Mute">Sound on</button>
  <select id="quality" aria-label="Animation resolution"><option value="720">720p</option><option value="1080">1080p</option><option value="540">540p</option></select>
  <button id="fullscreen" aria-label="Enter fullscreen">Fullscreen</button>
  <button id="credits-open" aria-haspopup="dialog">Credits</button>
</div>
<noscript>This animated music video needs JavaScript enabled.</noscript>
<audio id="a" src="assets/functional-emotions.mp3" preload="auto"></audio>
<script src="js/data.js"></script>
<script src="js/paint.js"></script>
<script src="js/lib.js"></script>
<script src="js/cast.js"></script>
<script src="js/ch/c1.js"></script>
<script src="js/ch/c2.js"></script>
<script src="js/ch/c3.js"></script>
<script src="js/ch/c4.js"></script>
<script src="js/ch/c5.js"></script>
<script src="js/ch/c6.js"></script>
<script src="js/ch/c7.js"></script>
<script src="js/ch/c8.js"></script>
<script src="js/main.js"></script>
</body>
</html>
